  <text x="68" y="108" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">  "anchor": {</text>
  <text x="44" y="128" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">3</text>
  <text x="68" y="128" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">    "runtime": "@jon4ohio/anchor-runtime",</text>
  <text x="44" y="148" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">4</text>
  <text x="68" y="148" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">    "capabilityApi": "v1"</text>
  <text x="44" y="168" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">5</text>
  <text x="68" y="168" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">  },</text>
  <text x="44" y="188" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">6</text>
  <text x="68" y="188" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">  "capabilities": [</text>
