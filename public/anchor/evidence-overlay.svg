  <text x="68" y="308" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">    "map": {</text>
  <text x="44" y="328" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">13</text>
  <text x="68" y="328" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#febc2e">      "Project Entry": "docs/project/entry.md",</text>
  <text x="44" y="348" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">14</text>
  <text x="68" y="348" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#febc2e">      "Handoff": "ai/handoff.md"</text>
  <text x="44" y="368" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">15</text>
  <text x="68" y="368" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">    }</text>
  <text x="44" y="388" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">16</text>
  <text x="68" y="388" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">  }</text>
  <text x="44" y="408" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">17</text>
  <text x="68" y="408" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">}</text>

  <text x="44" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="rgba(240,240,238,0.4)">From this repository after</text>
  <text x="44" y="478" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#3d8f8d">anchor init</text>

