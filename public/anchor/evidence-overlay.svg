  <text x="484" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="rgba(240,240,238,0.45)">Contract: Handoff - Updated: 2026-07-25</text>
  <text x="484" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="rgba(240,240,238,0.7)">What changed recently? What's next?</text>
  <text x="484" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="rgba(240,240,238,0.7)">Session continuity for humans and AI - durable</text>
