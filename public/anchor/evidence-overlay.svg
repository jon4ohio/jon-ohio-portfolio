  <text x="68" y="208" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#3d8f8d">    "continuity@1",</text>
  <text x="44" y="228" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">8</text>
  <text x="68" y="228" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#3d8f8d">    "orientation@1",</text>
  <text x="44" y="248" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">9</text>
  <text x="68" y="248" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#3d8f8d">    "review@1"</text>
  <text x="44" y="268" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">10</text>
  <text x="68" y="268" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">  ],</text>
  <text x="44" y="288" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="rgba(240,240,238,0.35)">11</text>
  <text x="68" y="288" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">  "project": {</text>
