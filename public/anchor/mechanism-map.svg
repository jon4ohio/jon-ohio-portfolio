<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="mech-title mech-desc">
  <title id="mech-title">How Anchor maps hosts to project documentation</title>
  <desc id="mech-desc">
    Conceptual diagram. An AI host reads .anchor/config.json, which declares paths to
    Project Entry and Handoff in the repository.
  </desc>

  <rect width="640" height="360" fill="#0a1218"/>
  <rect x="16" y="16" width="608" height="328" fill="#0f1a22" stroke="rgba(240,240,238,0.12)" stroke-width="1"/>

  <text x="32" y="44" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" letter-spacing="0.14em" fill="#3d8f8d">CONCEPTUAL</text>
  <text x="608" y="44" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="rgba(240,240,238,0.45)">How it works</text>

  <!-- AI host -->
  <rect x="220" y="64" width="200" height="44" rx="2" fill="rgba(61,143,141,0.12)" stroke="#3d8f8d" stroke-width="1"/>
  <text x="320" y="91" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#f0f0ee">AI host</text>

  <line x1="320" y1="108" x2="320" y2="140" stroke="rgba(240,240,238,0.35)" stroke-width="1.5"/>
  <polygon points="320,148 315,136 325,136" fill="rgba(240,240,238,0.35)"/>

  <!-- config -->
  <rect x="170" y="152" width="300" height="52" rx="2" fill="rgba(255,255,255,0.04)" stroke="rgba(240,240,238,0.28)" stroke-width="1"/>
  <text x="320" y="174" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" fill="#f0f0ee">.anchor/config.json</text>
  <text x="320" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="rgba(240,240,238,0.45)">declares where durable docs should live</text>

  <line x1="240" y1="204" x2="160" y2="248" stroke="rgba(240,240,238,0.35)" stroke-width="1.5"/>
  <polygon points="155,252 165,248 161,238" fill="rgba(240,240,238,0.35)"/>
  <line x1="400" y1="204" x2="480" y2="248" stroke="rgba(240,240,238,0.35)" stroke-width="1.5"/>
  <polygon points="485,252 475,248 479,238" fill="rgba(240,240,238,0.35)"/>

  <!-- targets -->
  <rect x="48" y="256" width="224" height="52" rx="2" fill="rgba(255,255,255,0.03)" stroke="rgba(240,240,238,0.18)" stroke-width="1"/>
  <text x="160" y="278" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">docs/project/entry.md</text>
  <text x="160" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="rgba(240,240,238,0.45)">Project Entry</text>

  <rect x="368" y="256" width="224" height="52" rx="2" fill="rgba(255,255,255,0.03)" stroke="rgba(240,240,238,0.18)" stroke-width="1"/>
  <text x="480" y="278" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="#f0f0ee">ai/handoff.md</text>
  <text x="480" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="rgba(240,240,238,0.45)">Handoff</text>
</svg>
